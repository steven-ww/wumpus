name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      run: ./gradlew build

  native-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up GraalVM 25
      uses: graalvm/setup-graalvm@v1
      with:
        distribution: graalvm
        java-version: '25'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        cache: gradle
        components: native-image

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build app distribution
      run: .\gradlew.bat installDist

    - name: Build Windows native executable
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path build/native | Out-Null
        native-image --no-fallback -cp "build/install/wumpus/lib/*" com.example.wumpus.App build/native/wumpus

    - name: Upload Windows native executable
      uses: actions/upload-artifact@v4
      with:
        name: wumpus-windows-native
        path: build/native/wumpus.exe
