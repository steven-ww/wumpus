name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      run: ./gradlew build

  native-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up GraalVM 25
      uses: graalvm/setup-graalvm@v1
      with:
        distribution: graalvm
        java-version: '25'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        cache: gradle
        components: native-image

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build app distribution
      run: .\gradlew.bat installDist

    - name: Build Windows native executable
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path build/native | Out-Null
        $cp = (Get-ChildItem "build/install/wumpus/lib/*.jar" | ForEach-Object { $_.FullName }) -join ";"
        native-image --no-fallback -cp $cp -o build/native/wumpus `-Dfile.encoding=UTF-8 `-Dsun.stdout.encoding=UTF-8 `-Dsun.stderr.encoding=UTF-8 za.co.sww.game.wumpus.App

    - name: Upload Windows native executable
      uses: actions/upload-artifact@v4
      with:
        name: wumpus-windows-native
        path: build/native/wumpus.exe

  native-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up GraalVM 25
      uses: graalvm/setup-graalvm@v1
      with:
        distribution: graalvm
        java-version: '25'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        cache: gradle
        components: native-image

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build app distribution
      run: ./gradlew installDist

    - name: Build macOS native executable
      run: |
        mkdir -p build/native
        cp=$(echo build/install/wumpus/lib/*.jar | tr ' ' ':')
        native-image --no-fallback -cp "$cp" -o build/native/wumpus -Dfile.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8 za.co.sww.game.wumpus.App

    - name: Upload macOS native executable
      uses: actions/upload-artifact@v4
      with:
        name: wumpus-macos-arm64-native
        path: build/native/wumpus

  release-windows-native:
    if: startsWith(github.ref, 'refs/tags/')
    needs: native-windows
    runs-on: ubuntu-latest
    steps:
    - name: Download Windows native artifact
      uses: actions/download-artifact@v4
      with:
        name: wumpus-windows-native
        path: dist

    - name: Rename artifact with tag
      run: mv dist/wumpus.exe dist/wumpus-${{ github.ref_name }}-windows.exe

    - name: Publish GitHub release asset
      uses: softprops/action-gh-release@v2
      with:
        files: dist/wumpus-${{ github.ref_name }}-windows.exe
        generate_release_notes: true

  release-macos-native:
    if: startsWith(github.ref, 'refs/tags/')
    needs: native-macos
    runs-on: ubuntu-latest
    steps:
    - name: Download macOS native artifact
      uses: actions/download-artifact@v4
      with:
        name: wumpus-macos-arm64-native
        path: dist

    - name: Rename artifact with tag
      run: mv dist/wumpus dist/wumpus-${{ github.ref_name }}-macos-arm64

    - name: Publish GitHub release asset
      uses: softprops/action-gh-release@v2
      with:
        files: dist/wumpus-${{ github.ref_name }}-macos-arm64
        generate_release_notes: true
