name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      run: ./gradlew build

  native-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up GraalVM 25
      uses: graalvm/setup-graalvm@v1
      with:
        distribution: graalvm
        java-version: '25'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        cache: gradle
        components: native-image

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build app distribution
      run: .\gradlew.bat installDist

    - name: Build Windows native executable
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path build/native | Out-Null
        native-image --no-fallback -cp "build/install/wumpus/lib/*" -o build/native/wumpus com.example.wumpus.App

    - name: Upload Windows native executable
      uses: actions/upload-artifact@v4
      with:
        name: wumpus-windows-native
        path: build/native/wumpus.exe

  release-windows-native:
    if: startsWith(github.ref, 'refs/tags/')
    needs: native-windows
    runs-on: ubuntu-latest
    steps:
    - name: Download Windows native artifact
      uses: actions/download-artifact@v4
      with:
        name: wumpus-windows-native
        path: dist

    - name: Rename artifact with tag
      run: mv dist/wumpus.exe dist/wumpus-${{ github.ref_name }}-windows.exe

    - name: Publish GitHub release asset
      uses: softprops/action-gh-release@v2
      with:
        files: dist/wumpus-${{ github.ref_name }}-windows.exe
        generate_release_notes: true
